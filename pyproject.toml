[project]
name = "bookmark-organization"
version = "0.1.0"
description = "Local, preservation-first AI bookmark organization"
requires-python = ">=3.13,<3.14"
dependencies = [
 "fastapi", "uvicorn", "jinja2", "python-multipart", "beautifulsoup4",
 "httpx", "trafilatura", "pydantic", "numpy", "scikit-learn", "playwright"
]
[project.scripts]
bookmark-organization = "bookmark_organization.app:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/bookmark_organization"]
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
